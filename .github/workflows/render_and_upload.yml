name: Render and upload video

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: "Folder name under videos/ to render and upload (e.g. zoomies)"
        required: true
      skip_youtube:
        description: "Skip the YouTube upload step (use when retrying after YouTube already succeeded)"
        required: false
        default: "false"

jobs:
  call:
    uses: ./.github/workflows/_render_and_upload.yml
    with:
      video_slug: ${{ github.event.inputs.video_slug }}
      skip_youtube: ${{ github.event.inputs.skip_youtube }}
    secrets: inherit
