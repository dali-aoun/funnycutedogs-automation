name: Daily shorts publish

# Auto-publishes the next queued short (videos/shorts_queue.txt, one slug
# per line, consumed top to bottom) twice a day. This runs independently of
# the long-form Tue/Thu/Sun schedule (scheduled_publish.yml) to maximize
# reach/watch-time velocity for YouTube Shorts + Instagram Reels. Two
# posts/day doubles the number of algorithmic "impression tests" the
# channel gets per day while reach is still near zero, at the cost of
# draining the queue twice as fast.
#
# Cron times (2026-09-24): shifted 6h earlier than the original 15:00/21:00
# UTC slots (which land as actual publishes around 18:xx/23:xx UTC — GitHub
# Actions schedules are best-effort and slip a couple hours). This is a
# TEST, not a confirmed fix: Instagram's own "Most active times" chart for
# @dogslover_petslover showed a 6am-12pm peak, but the timezone basis of
# that chart wasn't verified (could be UTC, the account's set timezone, or
# the viewer's local browser time) — so treat this as a hypothesis to
# compare against the previous slot's reach/retention over 1-2 weeks, not
# a guaranteed improvement. Revert to "0 15 * * *" / "0 21 * * *" if it
# doesn't help.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.peek.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Peek next short in queue
        id: peek
        run: |
          if [ ! -s videos/shorts_queue.txt ]; then
            echo "Shorts queue empty, nothing to publish"
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slug=$(head -n 1 videos/shorts_queue.txt)" >> "$GITHUB_OUTPUT"

  publish:
    needs: peek
    if: needs.peek.outputs.slug != ''
    uses: ./.github/workflows/_shorts_only.yml
    with:
      video_slug: ${{ needs.peek.outputs.slug }}
    secrets: inherit

  dequeue:
    needs: [peek, publish]
    if: needs.peek.outputs.slug != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove published short from queue
        run: |
          SLUG="${{ needs.peek.outputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            if [ ! -s videos/shorts_queue.txt ] || [ "$(head -n 1 videos/shorts_queue.txt)" != "$SLUG" ]; then
              echo "$SLUG is no longer at the front of the queue (already dequeued by another run) — nothing to do"
              exit 0
            fi
            tail -n +2 videos/shorts_queue.txt > videos/shorts_queue.txt.tmp && mv videos/shorts_queue.txt.tmp videos/shorts_queue.txt
            git add videos/shorts_queue.txt
            git commit -m "chore: dequeue $SLUG (published successfully)"
            if git push; then
              echo "Dequeued successfully"
              exit 0
            fi
            echo "Push failed (race with another run), retrying ($i)..."
            sleep 3
          done
          echo "::error::Failed to dequeue $SLUG after 5 attempts"
          exit 1
