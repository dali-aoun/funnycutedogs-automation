name: Daily shorts publish

# Auto-publishes the next queued short (videos/shorts_queue.txt, one slug
# per line, consumed top to bottom) twice a day (15:00 and 21:00 UTC). This
# runs independently of the long-form Tue/Thu/Sun schedule
# (scheduled_publish.yml) to maximize reach/watch-time velocity for YouTube
# Shorts + Instagram Reels. Two posts/day doubles the number of algorithmic
# "impression tests" the channel gets per day while reach is still near
# zero, at the cost of draining the queue twice as fast.
#
# The queue is only dequeued AFTER a successful publish. If publish fails,
# the slug stays at the front of the queue so the next run retries it —
# nothing gets silently dropped. The peek/dequeue split already tolerates
# two runs landing close together (retry-with-reset + idempotency check),
# so running twice a day needs no other changes.
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.peek.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Peek next short in queue
        id: peek
        run: |
          if [ ! -s videos/shorts_queue.txt ]; then
            echo "Shorts queue empty, nothing to publish"
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slug=$(head -n 1 videos/shorts_queue.txt)" >> "$GITHUB_OUTPUT"

  publish:
    needs: peek
    if: needs.peek.outputs.slug != ''
    uses: ./.github/workflows/_shorts_only.yml
    with:
      video_slug: ${{ needs.peek.outputs.slug }}
    secrets: inherit

  dequeue:
    needs: [peek, publish]
    if: needs.peek.outputs.slug != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove published short from queue
        run: |
          SLUG="${{ needs.peek.outputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            if [ ! -s videos/shorts_queue.txt ] || [ "$(head -n 1 videos/shorts_queue.txt)" != "$SLUG" ]; then
              echo "$SLUG is no longer at the front of the queue (already dequeued by another run) — nothing to do"
              exit 0
            fi
            tail -n +2 videos/shorts_queue.txt > videos/shorts_queue.txt.tmp && mv videos/shorts_queue.txt.tmp videos/shorts_queue.txt
            git add videos/shorts_queue.txt
            git commit -m "chore: dequeue $SLUG (published successfully)"
            if git push; then
              echo "Dequeued successfully"
              exit 0
            fi
            echo "Push failed (race with another run), retrying ($i)..."
            sleep 3
          done
          echo "::error::Failed to dequeue $SLUG after 5 attempts"
          exit 1
