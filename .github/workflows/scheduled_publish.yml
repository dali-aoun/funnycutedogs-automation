name: Scheduled publish

# Auto-publishes the next queued video (videos/queue.txt, one slug per line,
# consumed top to bottom) on the channel's cadence: Tue, Thu, Sun at 15:00 UTC.
# Fully autonomous — no manual trigger needed once videos are queued.
#
# The queue is only dequeued AFTER a successful publish. If publish fails,
# the slug stays at the front of the queue so the next run retries it —
# nothing gets silently dropped.
on:
  schedule:
    - cron: "0 15 * * 2,4,0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.peek.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Peek next video in queue
        id: peek
        run: |
          if [ ! -s videos/queue.txt ]; then
            echo "Queue empty, nothing to publish"
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slug=$(head -n 1 videos/queue.txt)" >> "$GITHUB_OUTPUT"

  publish:
    needs: peek
    if: needs.peek.outputs.slug != ''
    uses: ./.github/workflows/_render_and_upload.yml
    with:
      video_slug: ${{ needs.peek.outputs.slug }}
    secrets: inherit

  dequeue:
    needs: [peek, publish]
    if: needs.peek.outputs.slug != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove published video from queue
        run: |
          SLUG="${{ needs.peek.outputs.slug }}"
          tail -n +2 videos/queue.txt > videos/queue.txt.tmp && mv videos/queue.txt.tmp videos/queue.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/queue.txt
          git diff --cached --quiet || git commit -m "chore: dequeue $SLUG (published successfully)"
          git push
